name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Check Python syntax
        run: python -m compileall -q app

      - name: Run unit tests
        run: python -m pytest -q

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  minio-recovery-integration:
    runs-on: ubuntu-latest
    env:
      CLOUDMENTOR_RUN_MINIO_INTEGRATION: "1"
      MINIO_INTEGRATION_IMAGE: cloudmentor-minio-integration:2025-10-15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Build pinned MinIO integration image
        run: |
          docker build \
            --tag "$MINIO_INTEGRATION_IMAGE" \
            --file tests/containers/minio/Dockerfile \
            tests/containers/minio

      - name: Run MinIO recovery integration tests
        run: |
          python -m pytest -q \
            tests/test_minio_recovery_integration.py

  postgres-concurrent-ingestion-integration:
    runs-on: ubuntu-latest
    env:
      CLOUDMENTOR_RUN_POSTGRES_INTEGRATION: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run PostgreSQL concurrent-ingestion integration test
        run: |
          python -m pytest -q \
            tests/test_postgres_concurrent_ingestion_integration.py
